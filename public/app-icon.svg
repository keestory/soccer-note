<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="#059669"/>

  <!-- Soccer ball pattern (simplified pentagon) -->
  <g transform="translate(512, 512)">
    <!-- White circle background -->
    <circle r="340" fill="white"/>

    <!-- Black pentagons for soccer ball pattern -->
    <!-- Center pentagon -->
    <polygon points="0,-120 114,-37 70,97 -70,97 -114,-37" fill="#1f2937"/>

    <!-- Top pentagon -->
    <polygon points="0,-340 68,-270 42,-175 -42,-175 -68,-270" fill="#1f2937" transform="rotate(0)"/>

    <!-- Other pentagons around -->
    <polygon points="0,-340 68,-270 42,-175 -42,-175 -68,-270" fill="#1f2937" transform="rotate(72)"/>
    <polygon points="0,-340 68,-270 42,-175 -42,-175 -68,-270" fill="#1f2937" transform="rotate(144)"/>
    <polygon points="0,-340 68,-270 42,-175 -42,-175 -68,-270" fill="#1f2937" transform="rotate(216)"/>
    <polygon points="0,-340 68,-270 42,-175 -42,-175 -68,-270" fill="#1f2937" transform="rotate(288)"/>

    <!-- Connecting lines (hexagon edges) -->
    <g stroke="#1f2937" stroke-width="16" fill="none">
      <line x1="70" y1="97" x2="185" y2="160"/>
      <line x1="-70" y1="97" x2="-185" y2="160"/>
      <line x1="114" y1="-37" x2="230" y2="-85"/>
      <line x1="-114" y1="-37" x2="-230" y2="-85"/>
      <line x1="0" y1="-120" x2="0" y2="-230"/>
    </g>
  </g>

  <!-- Notepad/clipboard accent -->
  <g transform="translate(700, 700)">
    <rect x="0" y="0" width="200" height="250" rx="20" fill="white" stroke="#059669" stroke-width="8"/>
    <rect x="60" y="-30" width="80" height="50" rx="10" fill="#059669"/>
    <line x1="30" y1="70" x2="170" y2="70" stroke="#d1d5db" stroke-width="12" stroke-linecap="round"/>
    <line x1="30" y1="120" x2="170" y2="120" stroke="#d1d5db" stroke-width="12" stroke-linecap="round"/>
    <line x1="30" y1="170" x2="130" y2="170" stroke="#d1d5db" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
